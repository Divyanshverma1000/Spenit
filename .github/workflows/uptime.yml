# Uptime check: every 10 minutes, the API (with its database) and the app must answer.
# A failed run makes GitHub email you (Settings → Notifications → Actions: "Send
# notifications for failed workflows only"). GitHub may delay scheduled runs a little,
# and pauses them after 60 days without commits; re-enable from the Actions tab.
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API and database
        run: |
          for i in 1 2 3; do
            body=$(curl -fsS --max-time 20 https://spenit-api.divyanshverma0428.workers.dev/health) && echo "$body" | grep -q '"status":"ok"' && { echo "ok: $body"; exit 0; }
            sleep 20
          done
          echo "::error::API /health failed three times: ${body:-no answer}"; exit 1
      - name: App
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 20 -o /dev/null https://spenit.vercel.app/auth && { echo ok; exit 0; }
            sleep 20
          done
          echo "::error::https://spenit.vercel.app did not answer"; exit 1
